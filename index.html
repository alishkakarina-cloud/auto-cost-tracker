<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Cost Tracker — Калькулятор себестоимости авто</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="header">
    <div class="brand">
      <span class="brand-title">AUTO<span class="brand-accent">COST</span></span>
      <span class="brand-sub">Калькулятор себестоимости авто</span>
    </div>
  </header>

  <section class="card">
    <h2 class="card-title">Курсы валют</h2>
    <div class="rates-grid">
      <div class="field">
        <label for="rateAedUsd">AED → USD</label>
        <input type="number" id="rateAedUsd" step="0.0001" value="3.6725">
        <span class="hint">Фиксированный курс дирхама (можно менять вручную)</span>
      </div>
      <div class="field">
        <label for="rateUsdKgs">USD → KGS</label>
        <div class="rate-with-button">
          <input type="number" id="rateUsdKgs" step="0.01" value="87.5">
          <button type="button" id="fetchRateBtn" class="btn-secondary">Обновить курс</button>
        </div>
        <span class="hint" id="rateUpdatedHint">Курс не обновлялся из интернета</span>
      </div>
    </div>
  </section>

  <section class="card">
    <h2 class="card-title">Расходы</h2>

    <div class="field-row">
      <label>Цена авто</label>
      <div class="amount-currency">
        <input type="number" id="carPrice" min="0" step="0.01" placeholder="0">
        <select id="carPriceCur">
          <option value="AED" selected>AED</option>
          <option value="USD">USD</option>
          <option value="KGS">KGS</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <label>Логистика / доставка</label>
      <div class="amount-currency">
        <input type="number" id="logistics" min="0" step="0.01" placeholder="0">
        <select id="logisticsCur">
          <option value="AED">AED</option>
          <option value="USD" selected>USD</option>
          <option value="KGS">KGS</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <label>Растаможка / пошлины</label>
      <div class="amount-currency">
        <input type="number" id="customs" min="0" step="0.01" placeholder="0">
        <select id="customsCur">
          <option value="AED">AED</option>
          <option value="USD">USD</option>
          <option value="KGS" selected>KGS</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <label>Прочие расходы<span class="hint-inline">агент, страховка, подготовка</span></label>
      <div class="amount-currency">
        <input type="number" id="other" min="0" step="0.01" placeholder="0">
        <select id="otherCur">
          <option value="AED" selected>AED</option>
          <option value="USD">USD</option>
          <option value="KGS">KGS</option>
        </select>
      </div>
    </div>

    <button type="button" id="calcBtn" class="btn-primary">Рассчитать себестоимость</button>
  </section>

  <section class="card result-card" id="resultCard" hidden>
    <h2 class="card-title">Итоговая себестоимость</h2>
    <div class="result-grid">
      <div class="result-box">
        <span class="result-currency">AED</span>
        <span class="result-value" id="resultAed">0</span>
      </div>
      <div class="result-box">
        <span class="result-currency">USD</span>
        <span class="result-value" id="resultUsd">0</span>
      </div>
      <div class="result-box">
        <span class="result-currency">KGS</span>
        <span class="result-value" id="resultKgs">0</span>
      </div>
    </div>

    <button type="button" id="toggleBreakdownBtn" class="btn-link">Показать детали расчёта</button>
    <div class="breakdown" id="breakdown" hidden></div>
  </section>

  <section class="card">
    <div class="history-header">
      <h2 class="card-title">История расчётов</h2>
      <button type="button" id="clearHistoryBtn" class="btn-link btn-danger">Очистить всё</button>
    </div>
    <div id="historyList" class="history-list">
      <p class="empty-hint" id="emptyHistoryHint">Пока нет сохранённых расчётов</p>
    </div>
  </section>

</div>
<script src="script.js"></script>
</body>
</html>
